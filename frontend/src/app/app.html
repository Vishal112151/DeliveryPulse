<div class="app-frame">
  <aside class="rail" [class.rail-open]="menuOpen()">
    <a class="brand" routerLink="/dashboard" aria-label="DeliveryPulse dashboard">
      <span class="brand-mark"><lucide-icon [img]="ActivityIcon" [size]="19" /></span>
      <span class="brand-name">delivery<span>pulse</span></span>
    </a>

    <div class="rail-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      @for (item of navigation; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }" (click)="menuOpen.set(false)">
          <lucide-icon [img]="item.icon" [size]="17" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="rail-bottom">
      <span class="service-dot" [class.down]="apiState() === 'down'" [class.checking]="apiState() === 'checking'" aria-hidden="true"></span>
      <span>API connection</span>
      <span class="service-state">{{ apiState() === 'up' ? 'online' : apiState() === 'down' ? 'offline' : 'checking' }}</span>
    </div>
  </aside>

  <div class="content-frame">
    <header class="topbar">
      <button class="icon-button menu-toggle" type="button" aria-label="Toggle navigation"
        (click)="menuOpen.update(value => !value)">
        <lucide-icon [img]="MenuIcon" [size]="19" />
      </button>
      <div class="breadcrumb"><span>DeliveryPulse</span><span class="crumb-divider">/</span><strong>{{ pageTitle() }}</strong></div>
      <div class="topbar-right">
        <span class="local-badge"><span></span> LOCAL WORKSPACE</span>
        <div class="avatar" aria-label="Project manager">PM</div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
