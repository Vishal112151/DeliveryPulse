spring:
  application:
    name: deliverypulse-api
  config:
    # Read the repo-root .env (KEY=value is valid .properties) whether started from backend/ or the root.
    # Real environment variables still take precedence. Never commit .env.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deliverypulse}
    username: ${DB_USERNAME:deliverypulse_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    # Users live in the database (AuthService); skip Spring Boot's generated in-memory user.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:UTC}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  # Optional AI insights. Off by default; the deterministic workflow never depends on it.
  ai:
    enabled: ${AI_INSIGHTS_ENABLED:false}
    provider: ${AI_PROVIDER:anthropic}
    # AI_API_KEY works for any provider; ANTHROPIC_API_KEY is still read for older .env files.
    api-key: ${AI_API_KEY:${ANTHROPIC_API_KEY:}}
    # Empty picks the provider's default model (see AiInsightsProperties).
    model: ${AI_MODEL:}
    timeout: ${AI_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:16000}
    server-side-fallbacks: ${AI_SERVER_SIDE_FALLBACKS:true}
    # Project data leaves this machine only when this is explicitly true.
    external-data-sharing-authorized: ${AI_EXTERNAL_DATA_SHARING_AUTHORIZED:false}
    include-assignee-names: ${AI_INCLUDE_ASSIGNEE_NAMES:false}
    include-task-descriptions: ${AI_INCLUDE_TASK_DESCRIPTIONS:false}
    max-tasks: ${AI_MAX_TASKS:200}
    max-risks: ${AI_MAX_RISKS:10}
    max-explained-risks: ${AI_MAX_EXPLAINED_RISKS:5}
    max-text-length: ${AI_MAX_TEXT_LENGTH:500}
    # Optional second provider (gemini, anthropic or groq), tried when the first fails, e.g. on a quota limit.
    # Same switch, authorization and limits as above; empty model picks the provider's default.
    fallback:
      provider: ${AI_FALLBACK_PROVIDER:}
      api-key: ${AI_FALLBACK_API_KEY:}
      model: ${AI_FALLBACK_MODEL:}
  auth:
    # First admin, created only when there are no users. Without a password one is generated and logged once.
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    # Break-glass: true sets admin-password on the admin at every start. Turn it off again after use.
    admin-reset: ${APP_ADMIN_RESET:false}
    session-hours: ${APP_SESSION_HOURS:12}
  # Automated jobs, in APP_TIME_ZONE. Cron fields: second minute hour day-of-month month day-of-week.
  schedule:
    enabled: ${SCHEDULE_ENABLED:true}
    refresh-cron: ${SCHEDULE_REFRESH_CRON:0 0 6 * * *}
    weekly-report-cron: ${SCHEDULE_WEEKLY_REPORT_CRON:0 0 7 * * MON}
  # Optional read-only Jira Cloud sync. Off until all four of base URL, email, token and project keys are set.
  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-keys: ${JIRA_PROJECT_KEYS:}
    blocked-label: ${JIRA_BLOCKED_LABEL:blocked}
    timeout: ${JIRA_TIMEOUT:30s}
    max-issues: ${JIRA_MAX_ISSUES:5000}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:deliverypulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
# Tests must not depend on whatever a developer's .env contains.
app:
  time-zone: UTC
  cors:
    allowed-origin: http://localhost:4200
  ai:
    enabled: false
    api-key: ""
    external-data-sharing-authorized: false
    fallback:
      provider: ""
      api-key: ""
  schedule:
    enabled: false
  auth:
    admin-password: test-admin-password
  jira:
    base-url: ""
    email: ""
    api-token: ""
    project-keys: ""